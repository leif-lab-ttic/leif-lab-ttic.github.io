<header class="site-header">
  <nav class="nav container" aria-label="Main navigation">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% if site.logo_path and site.hide_navbar_logo != true %}<img src="{{ '/' | append: site.logo_path | relative_url }}" alt="" class="nav-logo" aria-hidden="true" />{% endif %}
      {{ site.title }}
    </a>
    <div class="nav-links">
      {% for item in site.data.nav %}
      <a href="{{ item.href | relative_url }}"{% if page.url == item.href %} class="active"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </div>
  </nav>
</header>
