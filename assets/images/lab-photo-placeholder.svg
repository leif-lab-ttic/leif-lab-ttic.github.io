  <ellipse cx="80"  cy="172" rx="22" ry="23" fill="#b5aca3"/>

  <ellipse cx="175" cy="215" rx="30" ry="36" fill="#a8a09a"/>
  <ellipse cx="175" cy="165" rx="23" ry="24" fill="#a8a09a"/>

  <ellipse cx="300" cy="210" rx="32" ry="38" fill="#b0a89f"/>
  <ellipse cx="300" cy="158" rx="25" ry="26" fill="#b0a89f"/>

  <ellipse cx="425" cy="215" rx="30" ry="36" fill="#a8a09a"/>
  <ellipse cx="425" cy="165" rx="23" ry="24" fill="#a8a09a"/>

  <ellipse cx="520" cy="220" rx="28" ry="34" fill="#b5aca3"/>
  <ellipse cx="520" cy="172" rx="22" ry="23" fill="#b5aca3"/>

  <!-- Front row (4 people) -->
