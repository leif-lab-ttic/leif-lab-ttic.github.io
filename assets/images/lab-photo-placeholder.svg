  <ellipse cx="480" cy="348" rx="34" ry="42" fill="#c4bbb3"/>
  <ellipse cx="480" cy="292" rx="26" ry="27" fill="#c4bbb3"/>

  <!-- Subtle label -->
  <text x="300" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8a7f76" letter-spacing="2">GROUP PHOTO</text>
</svg>
