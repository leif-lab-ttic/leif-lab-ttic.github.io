<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="22" fill="#1d1c1a">
  <!-- Complexity hierarchy for "The Parallelism Tradeoff" (Merrill & Sabharwal, TACL 2023):
       log-precision transformers are contained in (uniform) TC0, and can compute MAJORITY (not in AC0). -->
  <g stroke="#3a3a3a" stroke-width="1.5">
    <rect x="4" y="4" width="472" height="292" rx="10" fill="#f3f3f3"/>
    <rect x="20" y="40" width="384" height="244" rx="9" fill="#e3e3e3"/>
    <rect x="36" y="76" width="300" height="196" rx="8" fill="#d2d2d2"/>
    <rect x="52" y="112" width="218" height="148" rx="7" fill="#c0c0c0"/>
    <rect x="68" y="148" width="96" height="100" rx="6" fill="#adadad"/>
  </g>
  <g text-anchor="end">
    <text x="462" y="30">P</text>
    <text x="390" y="66">L</text>
    <text x="322" y="102">NC<tspan font-size="15" dy="-9">1</tspan></text>
    <text x="256" y="138">TC<tspan font-size="15" dy="-9">0</tspan></text>
    <text x="152" y="174">AC<tspan font-size="15" dy="-9">0</tspan></text>
  </g>
  <rect x="112" y="186" width="146" height="62" rx="6" fill="#8fb8dc" fill-opacity="0.85" stroke="#005494" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#00335c">
    <text x="185" y="212" font-size="19">Transformers</text>
    <text x="185" y="236" font-size="16" font-style="italic">(log precision)</text>
  </g>
</svg>
