<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    {% include nav.html %}

    <main class="container page-shell">
      <header class="page-header">
        {% if site.logo_path and site.hide_title_logo != true %}
        <img class="title-ship" src="{{ '/' | append: site.logo_path | relative_url }}" alt="" aria-hidden="true" />
        {% endif %}
        <h1>{{ page.heading }}</h1>
      </header>
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
