<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
    {% if site.favicon_dir %}
    <link rel="icon" type="image/x-icon" href="{{ '/' | append: site.favicon_dir | append: '/favicon.ico' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/' | append: site.favicon_dir | append: '/favicon-32x32.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/' | append: site.favicon_dir | append: '/favicon-16x16.png' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/' | append: site.favicon_dir | append: '/apple-touch-icon.png' | relative_url }}" />
    {% endif %}
  </head>
  <body>
    {% include nav.html %}

    <main class="container page-shell">
      <section class="page-header">
        {% if site.logo_path and site.hide_title_logo != true %}
        <div class="hero-heading-row">
          <img
            class="hero-ship"
            src="{{ '/' | append: site.logo_path | relative_url }}"
            alt=""
            aria-hidden="true"
          />
          <div>
            <p class="eyebrow">{{ page.eyebrow }}</p>
            <h1>{{ page.heading }}</h1>
          </div>
        </div>
        {% else %}
        <p class="eyebrow">{{ page.eyebrow }}</p>
        <h1>{{ page.heading }}</h1>
        {% endif %}
      </section>
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
