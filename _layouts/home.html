<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
    {% if site.favicon_dir %}
    <link rel="icon" type="image/x-icon" href="{{ '/' | append: site.favicon_dir | append: '/favicon.ico' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/' | append: site.favicon_dir | append: '/favicon-32x32.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/' | append: site.favicon_dir | append: '/favicon-16x16.png' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/' | append: site.favicon_dir | append: '/apple-touch-icon.png' | relative_url }}" />
    {% endif %}
  </head>
  <body>
    {% include nav.html %}

    <main>
      <section class="hero container">
        <div class="hero-copy">
          <div class="hero-heading-row">
            {% if site.logo_path %}
            <img
              class="hero-ship"
              src="{{ '/' | append: site.logo_path | relative_url }}"
              alt=""
              aria-hidden="true"
            />
            {% endif %}
            <div>
              <p class="eyebrow">{{ page.eyebrow }}</p>
              <h1>{{ page.heading }}</h1>
            </div>
          </div>
          <p class="lede">{{ page.lede }}</p>
          <div class="cta-row">
            <a class="button primary" href="{{ page.cta_primary.href | relative_url }}">{{ page.cta_primary.label }}</a>
            <a class="button secondary" href="{{ page.cta_secondary.href | relative_url }}">{{ page.cta_secondary.label }}</a>
          </div>
        </div>

        <aside class="hero-panel">
          <img
            class="lab-photo"
            src="{{ '/assets/images/lab-photo-placeholder.svg' | relative_url }}"
            alt="Lab group photo placeholder"
          />
        </aside>
      </section>

      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
