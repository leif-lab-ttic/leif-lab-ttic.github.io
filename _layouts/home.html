<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    {% include nav.html %}

    <main>
      <section class="hero container">
        <div class="hero-copy">
          <div class="hero-heading-row">
            {% if site.logo_path %}
            <img class="hero-ship" src="{{ '/' | append: site.logo_path | relative_url }}" alt="" aria-hidden="true" />
            {% endif %}
            <div>
              <h1>{{ page.heading }}</h1>
              {% if page.subheading %}<p class="acronym">{{ page.subheading }}</p>{% endif %}
            </div>
          </div>
          <p class="lede">{{ page.lede }}</p>
        </div>

        {% if page.photo %}
        <figure class="hero-photo">
          <img src="{{ page.photo | relative_url }}" alt="{{ page.photo_alt }}" />
        </figure>
        {% endif %}
      </section>

      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
