<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
  </head>
  <body>
    {% include nav.html %}

    <main>
      <section class="hero container">
        <div class="hero-copy">
          <p class="eyebrow">{{ page.eyebrow }}</p>
          <h1>{{ page.heading }}</h1>
          <p class="lede">{{ page.lede }}</p>
          <div class="cta-row">
            <a class="button primary" href="{{ page.cta_primary.href | relative_url }}">{{ page.cta_primary.label }}</a>
            <a class="button secondary" href="{{ page.cta_secondary.href | relative_url }}">{{ page.cta_secondary.label }}</a>
          </div>
        </div>

        <aside class="hero-panel">
          <img
            class="lab-photo"
            src="{{ '/assets/images/lab-photo.svg' | relative_url }}"
            alt="Illustrated group photo of the Merrill Lab"
          />
        </aside>
      </section>

      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
