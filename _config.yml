title: "LEIF Lab @ TTIC"

# Brand colors (TTIC blue palette — https://www.ttic.edu)
brand_color: "#006eb6"       # TTIC primary blue
brand_color_dark: "#005494"  # darker blue for hover/active states
# Previous red palette:
# brand_color: "#7f2a23"
# brand_color_dark: "#5b1e1a"

# Logo and favicon paths — swap to -red variants to revert
logo_path: "assets/images/ship-logo-blue.png"
favicon_dir: "assets/images/favicon-blue"

# UI feature flags
hide_navbar_logo: true   # set false to show logo in the navbar brand
hide_title_logo: false   # set true to hide logo in non-homepage page titles
description: "LEIF Lab at the Toyota Technological Institute at Chicago studies what transformers and other neural sequence models can and cannot compute."
og_image: "assets/images/og-image.jpg"  # social preview image (1200x630)
copyright: "© 2026 LEIF Lab"
url: "https://leif-lab-ttic.github.io"
baseurl: ""

markdown: kramdown
permalink: /:path.html

exclude:
  - README.md
  - LICENSE
  - AGENTS.md
  - CLAUDE.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
