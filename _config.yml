copyright: "© 2026 LEIF Lab"
url: "https://merrill-lab.github.io"
baseurl: ""

markdown: kramdown
permalink: /:path.html

exclude:
  - README.md
  - LICENSE
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
