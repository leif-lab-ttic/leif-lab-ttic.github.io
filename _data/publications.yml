# Selected publications, grouped by year (newest first).
#
# Fields per publication:
#   title     – paper title
#   link      – arXiv (or main) URL; the title links here, so don't repeat it in `links`
#   authors   – list of {name, lab: true (bold lab members), et_al: true (italic "et al.")}
#   venue     – optional {name: "ICML 2024", href: OpenReview/anthology URL}; shown in italics
#   links     – optional extra links, e.g. {name: "code", href: ...}
#   coverage  – optional press coverage, e.g. {name: "Quanta", href: ...}
#   figure    – optional thumbnail path, e.g. /assets/images/papers/foo.png (~560px wide PNG)
#   figure_alt – alt text for the figure
#   emblem    – optional fallback when there's no figure: lambda, tree, or plot

